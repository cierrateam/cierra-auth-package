name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # Curated valid PHP x Laravel x testbench combinations matching the
        # package's composer constraints (php ^8.2, illuminate ^11|^12|^13).
        # Laravel 13 requires PHP >= 8.3, so combos are listed explicitly
        # rather than as a cross-product to avoid impossible pairs.
        include:
          - { os: ubuntu-latest, php: '8.2', laravel: '11.*', testbench: '9.*', carbon: '^3', stability: prefer-lowest }
          - { os: ubuntu-latest, php: '8.2', laravel: '11.*', testbench: '9.*', carbon: '^3', stability: prefer-stable }
          - { os: ubuntu-latest, php: '8.3', laravel: '12.*', testbench: '10.*', carbon: '^3', stability: prefer-stable }
          - { os: ubuntu-latest, php: '8.4', laravel: '13.*', testbench: '11.*', carbon: '^3', stability: prefer-stable }

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.carbon }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci
